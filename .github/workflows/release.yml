name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/ferforastieri/valkyris
  UPDATER_IMAGE: ghcr.io/ferforastieri/valkyris-updater
  RELEASE_SERIES: '1.0'
  # Run 13 published v1.0.5. This keeps the next automatic release at v1.0.6.
  RELEASE_PATCH_OFFSET: 8

jobs:
  prepare:
    name: Preparar versão automática
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Gerar versão a partir da execução
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          patch=$((GITHUB_RUN_NUMBER - RELEASE_PATCH_OFFSET))
          test "$patch" -gt 0
          {
            echo "version=v${RELEASE_SERIES}.${patch}"
            echo "apk_version=${RELEASE_SERIES}.${patch}"
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "commit=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Imagem · ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar e publicar imagem nativa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: BUILD_VERSION=${{ needs.prepare.outputs.version }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Compilar e publicar atualizador nativo
        uses: docker/build-push-action@v6
        with:
          context: updater
          file: updater/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.UPDATER_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=release-updater-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-updater-${{ matrix.arch }}

  manifest:
    name: Manifesto multiarch
    runs-on: ubuntu-latest
    needs: [prepare, image]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar tags multiarch
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools create \
            --tag "$UPDATER_IMAGE:$VERSION" \
            "$UPDATER_IMAGE:$VERSION-amd64" \
            "$UPDATER_IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$UPDATER_IMAGE:$VERSION"

  android:
    name: APK assinado
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valkyris.jks"
      - name: Compilar APK assinado
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/valkyris.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VALKYRIS_VERSION_NAME: ${{ needs.prepare.outputs.apk_version }}
          VALKYRIS_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: ./gradlew --stacktrace lintRelease testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: valkyris-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  smoke:
    name: Smoke · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [prepare, manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Iniciar e verificar imagem nativa
        env:
          CONTAINER: valkyris-smoke-${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker pull "$IMAGE:$VERSION"
          docker run -d --rm --name "$CONTAINER" -p 127.0.0.1:18443:8443 "$IMAGE:$VERSION"
          for attempt in $(seq 1 30); do
            if curl -kfsS https://127.0.0.1:18443/health | grep -q '"status":"ok"'; then
              docker stop "$CONTAINER"
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER"
          docker stop "$CONTAINER"
          exit 1

  release:
    name: Publicar artefatos
    runs-on: ubuntu-latest
    needs: [prepare, android, smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: valkyris-release-apk
          path: artifacts
      - name: Montar release verificável
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release
          cp artifacts/app-release.apk "release/valkyris-${RELEASE_VERSION}.apk"
          cp compose.yaml mediamtx.yml install.sh release/
          cp backend/internal/api/openapi.yaml release/openapi.yaml
          printf '%s\n' "$RELEASE_VERSION" > release/VERSION
          cd release
          sha256sum valkyris-*.apk compose.yaml mediamtx.yml install.sh openapi.yaml VERSION > SHA256SUMS
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: gh release create "$RELEASE_VERSION" release/* --generate-notes --target "$RELEASE_COMMIT" --latest=false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promover somente a versão mais nova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sort -V | tail -1)"
          if [ "$newest" = "$RELEASE_VERSION" ]; then
            gh release edit "$RELEASE_VERSION" --latest
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_VERSION"
            docker buildx imagetools create --tag "$UPDATER_IMAGE:latest" "$UPDATER_IMAGE:$RELEASE_VERSION"
          fi
