name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/ferforastieri/valky
  RELEASE_SERIES: '4.0'
  # Run 104 starts 3.0.0; subsequent successful CI runs increment the patch.
  RELEASE_PATCH_OFFSET: 175

jobs:
  prepare:
    name: Preparar versão automática
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit: ${{ steps.version.outputs.commit }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Gerar próxima versão (SemVer)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Boa prática: a próxima versão nasce SEMPRE da última publicada,
          # sem pular número (o run do pipeline não define mais a versão).
          # Maior versão já publicada (não a mais recente por data): evita repetir tag.
          ultima="$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" -q '.[].name' | sed 's/^v//' | sort -V | tail -1)"
          ultima="${ultima:-0.0.0}"
          major="${ultima%%.*}"
          resto="${ultima#*.}"
          minor="${resto%%.*}"
          patch="${resto#*.}"
          patch=$((patch + 1))
          # Convenção: "feat:" sobe a minor; quebra de compatibilidade sobe a major.
          mensagem="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" -q '.commit.message' 2>/dev/null | head -1)"
          case "$mensagem" in
            *BREAKING*|*!*) major=$((major + 1)); minor=0; patch=0 ;;
            feat*|*"(feat)"*) minor=$((minor + 1)); patch=0 ;;
          esac
          case "$mensagem" in
            docs:*|chore:*|style:*|test:*|ci:*) publica="false" ;;
            *) publica="true" ;;
          esac
          {
            echo "skip=$([ "$publica" = "true" ] && echo false || echo true)"
            echo "version=v${major}.${minor}.${patch}"
            echo "apk_version=${major}.${minor}.${patch}"
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "commit=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Imagem · ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar e publicar imagem nativa
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: BUILD_VERSION=${{ needs.prepare.outputs.version }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  manifest:
    name: Manifesto multiarch
    runs-on: ubuntu-latest
    needs: [prepare, image]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar tags multiarch
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  android:
    name: APK assinado
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # A validação (lint e testes) já roda na CI para este mesmo commit; aqui
      # só o APK assinado é construído — assim a release sai bem mais rápido.
      - name: Preparar configuração do Firebase
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > mobile/app/google-services.json
      - name: Preparar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valky.jks"
      - name: Compilar APK assinado
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/valky.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VALKY_FIREBASE_ENABLED: 'true'
          VALKY_VERSION_NAME: ${{ needs.prepare.outputs.apk_version }}
          VALKY_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        # Caminho rápido; se o cache do Gradle trouxer entrada velha (já
        # aconteceu com os módulos multiplataforma), tenta de novo do zero.
        run: ./gradlew --stacktrace assembleRelease || ./gradlew --stacktrace --refresh-dependencies assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valky-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


  release:
    name: Publicar artefatos
    runs-on: ubuntu-latest
    needs: [prepare, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: valky-release-apk
          path: artifacts
      - name: Montar release verificável
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release
          cp artifacts/app-release.apk "release/valky-${RELEASE_VERSION}.apk"
          cp compose.yaml mediamtx.yml install.sh release/
          cp backend/internal/api/openapi.yaml release/openapi.yaml
          printf '%s\n' "$RELEASE_VERSION" > release/VERSION
          cd release
          sha256sum valky-*.apk compose.yaml mediamtx.yml install.sh openapi.yaml VERSION > SHA256SUMS
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: gh release create "$RELEASE_VERSION" release/* --generate-notes --target "$RELEASE_COMMIT" --latest=false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promover somente a versão mais nova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sort -V | tail -1)"
          if [ "$newest" = "$RELEASE_VERSION" ]; then
            gh release edit "$RELEASE_VERSION" --latest
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_VERSION"
          fi
