name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/ferforastieri/valkyris
  UPDATER_IMAGE: ghcr.io/ferforastieri/valkyris-updater

jobs:
  image:
    name: Imagem · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar e publicar imagem nativa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: BUILD_VERSION=${{ github.ref_name }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Compilar e publicar atualizador nativo
        uses: docker/build-push-action@v6
        with:
          context: updater
          file: updater/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.UPDATER_IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=release-updater-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-updater-${{ matrix.arch }}

  manifest:
    name: Manifesto multiarch
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar tags multiarch
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_REF_NAME}" \
            --tag "$IMAGE:latest" \
            "$IMAGE:${GITHUB_REF_NAME}-amd64" \
            "$IMAGE:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools create \
            --tag "$UPDATER_IMAGE:${GITHUB_REF_NAME}" \
            --tag "$UPDATER_IMAGE:latest" \
            "$UPDATER_IMAGE:${GITHUB_REF_NAME}-amd64" \
            "$UPDATER_IMAGE:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect "$UPDATER_IMAGE:${GITHUB_REF_NAME}"

  android:
    name: APK assinado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valkyris.jks"
      - name: Compilar APK assinado
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/valkyris.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace lintRelease testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: valkyris-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  smoke:
    name: Smoke · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Iniciar e verificar imagem nativa
        env:
          CONTAINER: valkyris-smoke-${{ matrix.arch }}
        run: |
          docker pull "$IMAGE:${GITHUB_REF_NAME}"
          docker run -d --rm --name "$CONTAINER" -p 127.0.0.1:18443:8443 "$IMAGE:${GITHUB_REF_NAME}"
          for attempt in $(seq 1 30); do
            if curl -kfsS https://127.0.0.1:18443/health | grep -q '"status":"ok"'; then
              docker stop "$CONTAINER"
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER"
          docker stop "$CONTAINER"
          exit 1

  release:
    name: Publicar artefatos
    runs-on: ubuntu-latest
    needs: [android, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: valkyris-release-apk
          path: artifacts
      - name: Montar release verificável
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp artifacts/app-release.apk "release/valkyris-${RELEASE_VERSION}.apk"
          cp compose.yaml mediamtx.yml install.sh release/
          cp backend/internal/api/openapi.yaml release/openapi.yaml
          printf '%s\n' "$RELEASE_VERSION" > release/VERSION
          cd release
          sha256sum valkyris-*.apk compose.yaml mediamtx.yml install.sh openapi.yaml VERSION > SHA256SUMS
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
