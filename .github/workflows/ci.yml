name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detectar alterações
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      web: ${{ steps.paths.outputs.web }}
      android: ${{ steps.paths.outputs.android }}
      container: ${{ steps.paths.outputs.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classificar caminhos alterados
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            changed_files="$(git ls-files)"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          backend=false
          web=false
          android=false
          container=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*.yml)
                backend=true; web=true; android=true; container=true ;;
              backend/*)
                backend=true
                case "$file" in *_test.go) ;; *) container=true ;; esac ;;
              web/*)
                web=true; container=true ;;
              mobile/*)
                android=true ;;
              compose.yaml|mediamtx.yml|install.sh|.dockerignore)
                container=true ;;
            esac
          done <<EOF
          $changed_files
          EOF

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "android=$android"
            echo "container=$container"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend · Go
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatação
        run: test -z "$(gofmt -l .)"
      - name: Análise estática
        run: go vet ./...
      - name: Vulnerabilidades conhecidas
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Testes
        run: go test -race -coverprofile=coverage.out ./...
      - name: Compilação
        run: CGO_ENABLED=1 go build -trimpath ./cmd/valky

  web:
    name: Web · Astro
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Dependências
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck, build e testes
        working-directory: web
        run: pnpm test

  android:
    name: Mobile · Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Lint, testes e APK debug
        working-directory: mobile
        run: ./gradlew --stacktrace lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valky-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

  container:
    name: Container · Docker
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build da imagem amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: valky:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Smoke test HTTPS
        run: |
          docker run -d --rm --name valky-ci -p 127.0.0.1:18443:8443 valky:ci
          for attempt in $(seq 1 45); do
            if curl -kfsS https://127.0.0.1:18443/health | grep -q '"status":"ok"'; then
              curl -kfsS https://127.0.0.1:18443/app/ -o /tmp/valky-viewer.html
              grep -q 'Valky · Consulta' /tmp/valky-viewer.html
              docker stop valky-ci
              exit 0
            fi
            sleep 1
          done
          docker logs valky-ci
          docker stop valky-ci
          exit 1
