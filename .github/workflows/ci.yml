name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detectar alterações
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      web: ${{ steps.paths.outputs.web }}
      android: ${{ steps.paths.outputs.android }}
      container: ${{ steps.paths.outputs.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classificar caminhos alterados
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            changed_files="$(git ls-files)"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          backend=false
          web=false
          android=false
          container=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci.yml)
                backend=true; web=true; android=true; container=true ;;
              backend/*)
                backend=true
                case "$file" in *_test.go) ;; *) container=true ;; esac ;;
              updater/*)
                backend=true; container=true ;;
              web/*)
                web=true ;;
              mobile/*)
                android=true ;;
              compose.yaml|mediamtx.yml|install.sh|.dockerignore)
                container=true ;;
            esac
          done <<EOF
          $changed_files
          EOF

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "android=$android"
            echo "container=$container"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend · Go
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatação
        run: test -z "$(gofmt -l .)"
      - name: Análise estática
        run: go vet ./...
      - name: Testes
        run: go test -race -coverprofile=coverage.out ./...
      - name: Compilação
        run: CGO_ENABLED=1 go build -trimpath ./cmd/valkyris
      - name: Atualizador
        working-directory: updater
        run: go test ./... && go build ./...

  web:
    name: Web · Astro
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Dependências
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck, build e testes
        working-directory: web
        run: pnpm test

  android:
    name: Mobile · Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, testes e APK debug
        working-directory: mobile
        run: ./gradlew --stacktrace lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: valkyris-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

  container:
    name: Container · Docker
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: valkyris:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Build do atualizador
        run: docker build -t valkyris-updater:ci updater
      - name: Smoke test HTTPS
        run: |
          docker run -d --rm --name valkyris-ci -p 127.0.0.1:18443:8443 valkyris:ci
          for attempt in $(seq 1 20); do
            if curl -kfsS https://127.0.0.1:18443/health | grep -q '"status":"ok"'; then
              docker stop valkyris-ci
              exit 0
            fi
            sleep 1
          done
          docker logs valkyris-ci
          docker stop valkyris-ci
          exit 1
