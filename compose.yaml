name: valky

services:
  valky:
    image: ghcr.io/ferforastieri/valky:${VALKY_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
    environment:
      VALKY_LISTEN: :8443
      VALKY_GEOCODER_URL: ${VALKY_GEOCODER_URL:-https://photon.komoot.io/reverse}
      VALKY_DATA_DIR: /data
      VALKY_DATABASE: /data/valky.db
      VALKY_TLS_CERT: /data/tls/server.crt
      VALKY_TLS_KEY: /data/tls/server.key
      VALKY_MASTER_KEY_FILE: /data/secrets/master.key
      VALKY_MEDIA_API: http://mediamtx:9997
      VALKY_MEDIA_PLAYBACK: http://mediamtx:9996
      VALKY_MEDIA_WEBRTC: http://mediamtx:8889
      VALKY_MEDIA_RTSP: rtsp://mediamtx:8554
      VALKY_MEDIA_RECORDINGS: /data/recordings
      VALKY_FIREBASE_CREDENTIALS_FILE: ${VALKY_FIREBASE_CREDENTIALS_FILE:-/data/secrets/firebase-service-account.json}
    ports:
      - "${VALKY_PORT:-8443}:8443"
    volumes:
      - valky-data:/data
      - type: volume
        source: recording-buffer
        target: /data/recordings
        volume:
          nocopy: true
    networks: [valky]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mediamtx:
    image: bluenviron/mediamtx:1.15.4-ffmpeg
    restart: unless-stopped
    command: ["/etc/mediamtx.yml"]
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${VALKY_WEBRTC_HOSTS:-}
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - type: bind
        source: ./mediamtx.yml
        target: /etc/mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
      - valky-data:/data
      - type: volume
        source: recording-buffer
        target: /data/recordings
        volume:
          nocopy: true
    expose:
      - "8554"
      - "8889"
      - "9997"
      - "9996"
    networks: [valky]
    security_opt:
      - no-new-privileges:true

networks:
  valky:
    internal: false

volumes:
  valky-data:

  recording-buffer:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=384m,nodev,nosuid,noexec,mode=0755"
