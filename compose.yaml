name: valkyris

services:
  valkyris:
    image: ghcr.io/ferforastieri/valkyris:${VALKYRIS_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
    environment:
      VALKYRIS_LISTEN: :8443
      VALKYRIS_DATA_DIR: /data
      VALKYRIS_DATABASE: /data/valkyris.db
      VALKYRIS_TLS_CERT: /data/tls/server.crt
      VALKYRIS_TLS_KEY: /data/tls/server.key
      VALKYRIS_MASTER_KEY_FILE: /data/secrets/master.key
      VALKYRIS_MEDIA_URL: http://mediamtx:8888
      VALKYRIS_MEDIA_API: http://mediamtx:9997
      VALKYRIS_MEDIA_PLAYBACK: http://mediamtx:9996
      VALKYRIS_MEDIA_RECORDINGS: /data/recordings
      VALKYRIS_UPDATER_URL: http://updater:8080
      VALKYRIS_UPDATER_TOKEN: ${VALKYRIS_UPDATER_TOKEN:-}
    ports:
      - "${VALKYRIS_PORT:-8443}:8443"
    volumes:
      - valkyris-data:/data
    networks: [valkyris]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  updater:
    image: ghcr.io/ferforastieri/valkyris-updater:${VALKYRIS_VERSION:-latest}
    build:
      context: ./updater
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      VALKYRIS_UPDATER_TOKEN: ${VALKYRIS_UPDATER_TOKEN:-}
      VALKYRIS_INSTALL_DIR: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:rw
    networks: [valkyris]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mediamtx:
    image: bluenviron/mediamtx:1.15.4-ffmpeg
    restart: unless-stopped
    command: ["/etc/mediamtx.yml"]
    volumes:
      - type: bind
        source: ./mediamtx.yml
        target: /etc/mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
      - valkyris-data:/data
    expose:
      - "8888"
      - "9997"
      - "9996"
    networks: [valkyris]
    security_opt:
      - no-new-privileges:true

networks:
  valkyris:
    internal: false

volumes:
  valkyris-data:
