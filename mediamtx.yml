logLevel: info
api: true
apiAddress: :9997
apiEncryption: false
hls: false
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
srt: false
webrtc: true
webrtcAddress: :8889
# A fixed media port makes local ICE candidates reachable through Docker.
# The installer advertises the host LAN address through MTX_WEBRTCADDITIONALHOSTS.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
playback: true
playbackAddress: :9996
metrics: false
pprof: false
authMethod: internal
authInternalUsers:
  - user: any
    ips: ["127.0.0.1", "::1", "172.16.0.0/12"]
    permissions:
      - action: read
      - action: publish
      - action: api
      - action: playback
paths:
  all_others:
    source: publisher
    record: true
    recordPath: /data/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 2s
    recordDeleteAfter: 10m
